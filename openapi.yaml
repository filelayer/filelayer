              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "credential_in_query"
          x-codes:
            - "credential_in_query"
            - "bad_request"
        "401":
          description: "Missing or wrong password."
          headers:
            Content-Type:
              description: "Always `application/json`."
              schema:
                type: "string"
            Cache-Control:
              description: "Always `private, no-store, no-cache, must-revalidate, max-age=0`."
              schema:
                type: "string"
            Pragma:
              description: "Always `no-cache`."
              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
            WWW-Authenticate:
              description: "Always `FilelayerShare`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "password_required"
                retry:
                  method: "POST"
                  field: "password"
          x-codes:
            - "password_required"
        "404":
          description: "Not found — and deliberately indistinguishable from \"denied\". Internally the exact deny reason is recorded in the audit log; externally every reason that would confirm a file exists collapses to this, so the error surface is not an enumeration oracle across tenants. Covers: no such file, no live grant, a revoked grant, an expired grant, a grant whose download cap is exhausted, an ancestor grant that is no longer live, a forged or unknown share secret, and an `as:` naming an identity the project has never seen."
          headers:
            Content-Type:
              description: "Always `application/json`."
              schema:
                type: "string"
            Cache-Control:
              description: "Always `private, no-store, no-cache, must-revalidate, max-age=0`."
              schema:
                type: "string"
            Pragma:
              description: "Always `no-cache`."
              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "not_found"
          x-codes:
            - "not_found"
        "410":
          description: "The file itself has passed its `expiresAt`. Distinct from a dead grant, which is a 404: the file lifecycle gate runs before the grant decision, and a caller who reaches this has already been authorized."
          headers:
            Content-Type:
              description: "Always `application/json`."
              schema:
                type: "string"
            Cache-Control:
              description: "Always `private, no-store, no-cache, must-revalidate, max-age=0`."
              schema:
                type: "string"
            Pragma:
              description: "Always `no-cache`."
              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "gone"
          x-codes:
            - "gone"
        "413":
          description: "The request body exceeded 64 KiB."
          headers:
            Content-Type:
              description: "Always `application/json`."
              schema:
                type: "string"
            Cache-Control:
              description: "Always `private, no-store, no-cache, must-revalidate, max-age=0`."
              schema:
                type: "string"
            Pragma:
              description: "Always `no-cache`."
              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "payload_too_large"
          x-codes:
            - "payload_too_large"
        "500":
          description: "An unexpected failure. Never a decision — every authorization outcome is one of the statuses above."
          headers:
            Content-Type:
              description: "Always `application/json`."
              schema:
                type: "string"
            Cache-Control:
              description: "Always `private, no-store, no-cache, must-revalidate, max-age=0`."
              schema:
                type: "string"
            Pragma:
              description: "Always `no-cache`."
              schema:
                type: "string"
            Referrer-Policy:
              description: "Always `no-referrer`."
              schema:
                type: "string"
            X-Content-Type-Options:
              description: "Always `nosniff`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error: "internal"
          x-codes:
            - "internal"
components:
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      description: "Every error on these routes has this shape. `error` is a stable machine-readable code. The internal reason for a denial is deliberately NOT included — it is written to the audit log, where the operator who needs it can see it, and withheld from the caller, who would otherwise be able to distinguish \"does not exist\" from \"you may not have it\"."
      properties:
        error:
          type: "string"
          description: "The stable error code."
          enum:
            - "not_found"
            - "gone"
            - "password_required"
            - "credential_in_query"
            - "bad_request"
            - "payload_too_large"
            - "internal"
        retry:
          type: "object"
          description: "Present only on 401. How to re-issue the request successfully."
          properties:
            method:
              type: "string"
              enum:
                - "POST"
            field:
              type: "string"
              enum:
                - "password"
