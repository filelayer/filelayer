    post:
      tags:
        - "shares"
      operationId: "redeemShareWithPassword"
      summary: "Redeem a share link, supplying the password in the body."
      description: "Identical to the GET in every respect except that the password is read from the request body. The body is capped at 64 KiB. An unparseable JSON body is a 400. A request with no password against a password-protected link is a 401, exactly as the GET is."
