# PUBLISH @filelayer/core TO npm, FROM A TAG, WITH NO npm TOKEN ANYWHERE.
#
# A release is a tag `vX.Y.Z` pushed after the maintainer approved that exact
# version. This workflow is the only thing that runs `npm publish`. It
# authenticates with npm trusted publishing (OIDC): npm trusts this repository,
# this file and the `npm-publish` environment, and exchanges the job's
# short-lived OIDC token for a one-shot publish token. No npm credential exists
# on any machine, in this repository or in its secrets. npm attaches provenance
# to what it publishes, so anyone can check which commit and which workflow
# built a version.
#
# The trusted publisher on npmjs.com names this file by path and the
# environment by name. Renaming either breaks publishing until the npm
# configuration is changed to match.

name: Publish

on:
  push:
    tags: ['v*']
  # Catch-up path: publish the MCP registry entry for the version main already
  # carries, without publishing to npm. Its own "ok publish" (D049).
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway through a publish.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish ${{ github.ref_name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history: check:since and check:migrations read schema.sql at older
      # tags, and the "is this commit on main" check below needs main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # FIRST, before six minutes of gates: the tag must name the version in
      # package.json, and the tagged commit must be on main. A tag is the
      # maintainer's approval of one named version from main, nothing else.
      - name: The tag names the package version, and the commit is on main
        run: |
          node tools/check-release-tag.mjs --self-test
          node tools/check-release-tag.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      # Trusted publishing needs npm 11.5.1 or later; older clients skip the
      # OIDC exchange and fail with a misleading 401 or 404. And no token may be
      # present, because a token in the environment would be used instead of
      # OIDC and the release would no longer be what the trust names.
      - name: An npm that supports trusted publishing, and no npm token
        run: |
          npm install -g npm@^11.5.1
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + process.argv[1] + " cannot use trusted publishing (needs 11.5.1+)");
              process.exit(1);
            }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ]; then
            echo "::error::an npm token is set; this workflow publishes through OIDC only"
            exit 1
          fi

      - name: Install
        run: npm run bootstrap

      # The same two chains a release has always needed. Each ends in a stamp
      # for this exact tree, and `prepublishOnly` refuses to publish without
      # both, so a red gate cannot be followed by an upload.
      - name: npm run verify
        run: npm run verify

      - name: npm run verify:release
        run: npm run verify:release

      - name: npm publish (trusted publishing, with provenance)
        working-directory: packages/core
        run: npm publish --provenance --access public --tag latest

  # THE MCP REGISTRY ENTRY, PUBLISHED AFTER npm AND ONLY AFTER A SUCCESSFUL npm
  # PUBLISH (D049). An MCP client reads the registry entry and installs what it
  # names, so an entry ahead of npm points at a version that does not exist and
  # an entry behind it points at an old one. On a tag push this job needs
  # `publish` to have succeeded; on a manual run `publish` is skipped by design
  # and this publishes the entry for the version main carries, which must
  # already be on npm.
  #
  # The DNS key for filelayer.dev is the environment secret MCP_DNS_PRIVATE_KEY
  # (hex, ECDSA P-384), available only to jobs in the npm-publish environment
  # and only to this step. GitHub masks it in logs; nothing here prints it, and
  # tools/check-publish-workflow.mjs fails the build if anything starts to.
  mcp-registry:
    name: MCP registry entry
    needs: publish
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # The entry may only describe a version npm already serves, and only the
      # version this tree is at. server.json and package.json agreeing is
      # check:registry's job; this asks npm.
      - name: server.json names a version npm serves
        run: |
          v=$(node -p 'require("./server.json").version')
          p=$(node -p 'require("./packages/core/package.json").version')
          [ "$v" = "$p" ] || { echo "::error::server.json says $v and package.json says $p"; exit 1; }
          npm view "@filelayer/core@$v" version | grep -qx "$v" \
            || { echo "::error::@filelayer/core@$v is not on npm; the entry would point at nothing"; exit 1; }

      # PINNED BY VERSION AND BY CHECKSUM. The checksum is the published one for
      # this exact archive (registry_1.8.7_checksums.txt), recomputed when the
      # pin was written. A changed archive under the same version fails here.
      - name: Install mcp-publisher 1.8.7, verified
        env:
          MCP_PUBLISHER_VERSION: '1.8.7'
          MCP_PUBLISHER_SHA256: '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Log in to the MCP registry for filelayer.dev
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          [ -n "$MCP_DNS_PRIVATE_KEY" ] || { echo "::error::the npm-publish environment has no MCP_DNS_PRIVATE_KEY secret"; exit 1; }
          "$RUNNER_TEMP/mcp-publisher" login dns --algorithm ecdsap384 --domain filelayer.dev --private-key "$MCP_DNS_PRIVATE_KEY" >/dev/null

      - name: Publish the entry
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish

      # And ask the registry what it now serves, rather than trusting the exit
      # status. Retries, because the registry is read from a replica.
      - name: The registry serves the version npm serves
        run: |
          for i in 1 2 3 4 5 6; do
            node tools/check-mcp-registry-live.mjs && exit 0
            sleep 20
          done
          exit 1
